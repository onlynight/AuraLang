name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -W clippy::all

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Test (release — 含词法性能基准断言)
        run: cargo test --workspace --release --verbose

  aura-bootstrap:
    name: Aura Bootstrap (Phase 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aura-bootstrap-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust compiler + CLI (release)
        run: cargo build --release --workspace

      # Aura 编写的编译器（aura/compiler/）独立构建，与 Rust 编译器互不依赖。
      - name: Test framework self-test (Aura)
        run: |
          ./target/release/aura run aura/compiler/aura/lang/compiler/test/TestRunnerSelfTest.aura | tee /tmp/selftest.log
          grep -q "RESULT: PASS" /tmp/selftest.log

      - name: Phase 0 verification cases (Aura)
        run: |
          ./target/release/aura run tests/phase0_tests.aura | tee /tmp/phase0.log
          grep -q "RESULT: PASS" /tmp/phase0.log

      - name: Phase 1 verification cases (Aura lexer)
        run: |
          ./target/release/aura run tests/phase1_lexer_tests.aura | tee /tmp/phase1.log
          grep -q "RESULT: PASS" /tmp/phase1.log

      - name: Source snapshot check (Rust baseline)
        run: bash scripts/snapshot.sh

      - name: Build Aura compiler skeleton
        run: bash scripts/build-aura-compiler.sh

      # 条件4：std 必须来自 Aura 源码，不得依赖 Rust 预编译的 build/*.auc。
      # ubuntu 上执行静态断言；Windows 宿主（含 LLVM）会做隔离式实证校验。
      - name: Verify std loads from Aura sources (no .auc dependency)
        run: bash scripts/verify-pure-aura-std.sh

  frozen-bootstrap:
    name: Frozen Bootstrap Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 冻结的自举编译器（Stage-0 载体）随仓库分发，无需 Rust / LLVM 即可校验。
      # 统一走脚本入口：非 Windows 宿主仅做完整性校验；Windows 宿主（含 LLVM）
      # 会进一步执行纯 Aura 两轮自举 + 行为一致性检查。
      - name: Verify frozen self-bootstrap artifact
        run: bash scripts/self-bootstrap-frozen.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
